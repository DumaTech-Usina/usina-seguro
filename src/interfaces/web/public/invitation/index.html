<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Concluir cadastro — Usina do Seguro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/app/shared/base.css" />
  </head>
  <!-- REQ-422: the invitation link opens this page; it is open, the link is the key. -->
  <body class="access">
    <main class="access__main">
      <section class="card access__card">
        <div class="card__header">
          <span class="material-symbols-outlined">person_add</span>
          <h1 class="text-title">Concluir cadastro</h1>
        </div>
        <form id="form-invitation">
          <div class="card__body stack">
            <p class="text-muted">
              Defina a sua senha para entrar no sistema. O nome é opcional: sem ele, você
              aparece pelo e-mail.
            </p>
            <div class="field">
              <input
                class="field__input"
                name="name"
                autocomplete="name"
                placeholder=" "
              />
              <label class="field__label">Nome (opcional)</label>
            </div>
            <div class="field">
              <input
                class="field__input"
                name="password"
                type="password"
                autocomplete="new-password"
                placeholder=" "
                required
              />
              <label class="field__label">Senha</label>
              <span class="field__hint">De 12 a 128 caracteres.</span>
            </div>
          </div>
          <div class="card__footer">
            <button class="btn btn--filled" type="submit">Concluir cadastro</button>
          </div>
        </form>
        <div class="card__body stack">
          <p class="access__error" id="access-error" role="alert" hidden></p>
          <p id="access-done" role="status" hidden>
            Cadastro concluído. <a href="/app/login/">Entre com o seu e-mail e a sua senha.</a>
          </p>
        </div>
      </section>
    </main>

    <script type="module" src="/app/invitation/index.js"></script>
  </body>
</html>
