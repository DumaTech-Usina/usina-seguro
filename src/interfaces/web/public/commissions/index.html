<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comissões — Usina do Seguro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/app/shared/base.css" />
    <link rel="stylesheet" href="/app/commissions/index.css" />
  </head>
  <body class="shell" data-nav="commissions">
    <main class="content">
      <div class="content__inner">
        <div class="page-head">
          <div class="page-head__text">
            <h1 class="text-display">Comissões</h1>
            <p class="text-muted">
              OUT-05: a comissão acordada de cada apólice, calculada pela CT da proposta,
              com o ajuste quando houver.
            </p>
          </div>
        </div>

        <!-- Filtro por estado. O rótulo vem de shared/status.js, que é o único
             vocabulário de domínio da tela. -->
        <div class="filters" id="filters" role="tablist" aria-label="Estado da comissão"></div>

        <section class="card">
          <div class="card__header">
            <span class="material-symbols-outlined">percent</span>
            <h2 class="text-title">Comissão acordada</h2>
            <div class="card__header-actions" id="summary"></div>
          </div>
          <div class="card__body card__body--flush" id="list">
            <div class="card__body stack">
              <div class="skeleton" style="width: 40%"></div>
              <div class="skeleton" style="width: 70%"></div>
              <div class="skeleton" style="width: 55%"></div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="/app/shared/shell.js"></script>
    <script type="module" src="/app/commissions/index.js"></script>
  </body>
</html>
